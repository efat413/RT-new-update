name = "rongdhonutrade"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[build]
command = "npm run build"
watch_dir = "src"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"

[vars]
APP_URL = "https://rongdhonutrade.com"
RESEND_FROM_EMAIL = "support@rongdhonutrade.com"
SUPER_ADMIN_EMAILS = "cmt413uec@gmail.com"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "rongdhonu-db"
database_id = "3276795d-5593-42c0-8e14-947f3ab1172b"
migrations_dir = "migrations"

