      (function() {
        if (typeof window === 'undefined') return;
        try {
          window.addEventListener('error', function(event) {
            var src = (event && (event.filename || (event.error && event.error.stack))) || '';

            }
          }, true);

          var rawFetch = window.fetch;
          var fetchHolder = typeof rawFetch === 'function' ? rawFetch.bind(window) : rawFetch;

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (protoDesc && protoDesc.configurable && !protoDesc.set) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() { return fetchHolder; },
                  set: function(fn) { fetchHolder = fn; },
                  configurable: true,
                  enumerable: protoDesc.enumerable !== false
                });
              }
            } catch (e) {}
          }

          try {
            var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (!winDesc || (winDesc.configurable !== false && !winDesc.set)) {
              Object.defineProperty(window, 'fetch', {
                get: function() { return fetchHolder; },
                set: function(fn) { fetchHolder = fn; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {}
        } catch (e) {}
      })();
